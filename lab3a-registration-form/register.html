<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Registration form for Rangotsav 2026 cultural festival participants.">
<title>Cultural Festival Registration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%89</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h1>Rangotsav 2026</h1>
    <p class="subtitle">Cultural Festival - Participant Registration Form</p>

    <form action="#" method="get" id="registrationForm" novalidate>

        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name"
                   autocomplete="name" required>

            <label for="institute">Institute Name:</label>
            <input type="text" id="institute" name="institute" placeholder="Enter your college/school name"
                   autocomplete="organization" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com"
                   autocomplete="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number"
                   autocomplete="tel" pattern="[0-9]{10}" title="Enter a 10-digit mobile number"
                   inputmode="numeric">
        </fieldset>

        <fieldset>
            <legend>Event Details</legend>

            <label>Gender:</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male" checked> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>

            <label>Category of Participation:</label>
            <div class="radio-group">
                <label><input type="radio" name="category" value="Solo" checked> Solo</label>
                <label><input type="radio" name="category" value="Group"> Group</label>
            </div>

            <label for="event">Choose Your Event:</label>
            <select id="event" name="event">
                <option value="dance">Dance</option>
                <option value="singing">Singing</option>
                <option value="drama">Drama</option>
                <option value="painting">Painting</option>
                <option value="debate">Debate</option>
                <option value="photography">Photography</option>
            </select>

            <label>Additional Interests (select all that apply):</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="interest" value="Food Stalls"> Food Stalls</label>
                <label><input type="checkbox" name="interest" value="Workshops"> Workshops</label>
                <label><input type="checkbox" name="interest" value="DJ Night"> DJ Night</label>
                <label><input type="checkbox" name="interest" value="Exhibition"> Exhibition</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>About You</legend>
            <label for="message">Tell us about your experience or special requirements:</label>
            <textarea id="message" name="message" rows="4" maxlength="300"
                      placeholder="Write here..."></textarea>
            <p class="char-count"><span id="charCount">0</span>/300 characters</p>
        </fieldset>

        <div class="button-row">
            <input type="submit" value="Submit Registration">
            <input type="reset" value="Reset Form">
        </div>

    </form>

    <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
</div>

<script>
    // Live character counter for the textarea (progressive enhancement, no framework).
    const message = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    message.addEventListener('input', function () {
        charCount.textContent = message.value.length;
    });

    // Friendly inline confirmation on submit (form still uses native GET action).
    const form = document.getElementById('registrationForm');
    const status = document.getElementById('formStatus');
    form.addEventListener('submit', function (e) {
        if (!form.checkValidity()) {
            return; // let the browser show native validation messages
        }
        e.preventDefault();
        status.textContent = 'Thanks! Your registration details are ready to submit.';
    });

    form.addEventListener('reset', function () {
        status.textContent = '';
        charCount.textContent = '0';
    });
</script>

</body>
</html>
