<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 12 - Age Check</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f5;
      font-family: Georgia, "Times New Roman", serif;
      color: #1d2b36;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #c5d0d8;
      border-radius: 10px;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 18px; color: #5b6b78; font-size: .95rem; }
    label { display: block; margin: 12px 0 4px; font-size: .95rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #c5d0d8;
      border-radius: 6px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 11px;
      font-size: 1rem;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #1f6f8b;
      background: #1f6f8b;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <form class="card" action="check.php" method="post">
    <h1>Enter Your Details</h1>
    <p class="sub">Enter your name and age to visit the site.</p>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required placeholder="e.g. Varsha">

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="1" max="120" required placeholder="e.g. 20">

    <button type="submit">Submit</button>
  </form>
</body>
</html>
