<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 7 - Arithmetic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="calc" id="calcForm" novalidate>
    <h1>Arithmetic Calculator</h1>
    <p class="sub">Enter two numbers, choose an operation, then calculate.</p>

    <label for="num1">First number</label>
    <input type="number" id="num1" step="any" placeholder="e.g. 12">

    <label for="op">Operation</label>
    <select id="op">
      <option value="add">Addition (+)</option>
      <option value="sub">Subtraction (-)</option>
      <option value="mul">Multiplication (x)</option>
      <option value="div">Division (/)</option>
    </select>

    <label for="num2">Second number</label>
    <input type="number" id="num2" step="any" placeholder="e.g. 4">

    <div class="buttons">
      <button type="submit" id="calcBtn">Calculate</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>

    <div class="result" id="result">Result will appear here.</div>
  </form>

  <script src="script.js"></script>
</body>
</html>
