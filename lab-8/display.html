<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 8 - Submitted Information</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Submitted Information</h1>
    <p class="sub" id="status">Here are the details you entered.</p>

    <table id="infoTable">
      <tr><th>Name</th><td id="outName"></td></tr>
      <tr><th>Gender</th><td id="outGender"></td></tr>
      <tr><th>Mobile number</th><td id="outMobile"></td></tr>
      <tr><th>Email ID</th><td id="outEmail"></td></tr>
      <tr><th>City</th><td id="outCity"></td></tr>
      <tr><th>State</th><td id="outState"></td></tr>
      <tr><th>Country</th><td id="outCountry"></td></tr>
    </table>

    <div class="buttons">
      <a class="btn" href="index.html">Go back to form</a>
      <button type="button" id="clearBtn" class="secondary">Clear data</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
