<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 8 - User Information Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="card" id="userForm" novalidate>
    <h1>User Information Form</h1>
    <p class="sub">Fill in your details and submit. They will be shown on the next page.</p>

    <label for="name">Full name</label>
    <input type="text" id="name" placeholder="e.g. Varsha A">
    <span class="err" id="nameErr"></span>

    <label>Gender</label>
    <div class="radios">
      <label><input type="radio" name="gender" value="Female"> Female</label>
      <label><input type="radio" name="gender" value="Male"> Male</label>
      <label><input type="radio" name="gender" value="Other"> Other</label>
    </div>
    <span class="err" id="genderErr"></span>

    <label for="mobile">Mobile number</label>
    <input type="tel" id="mobile" maxlength="10" placeholder="10-digit number">
    <span class="err" id="mobileErr"></span>

    <label for="email">Email ID</label>
    <input type="email" id="email" placeholder="e.g. name@example.com">
    <span class="err" id="emailErr"></span>

    <label for="city">City</label>
    <input type="text" id="city" placeholder="e.g. Kurnool">
    <span class="err" id="cityErr"></span>

    <label for="state">State</label>
    <input type="text" id="state" placeholder="e.g. Andhra Pradesh">
    <span class="err" id="stateErr"></span>

    <label for="country">Country</label>
    <select id="country">
      <option value="">-- Select country --</option>
      <option>India</option>
      <option>United States</option>
      <option>United Kingdom</option>
      <option>Canada</option>
      <option>Australia</option>
      <option>Other</option>
    </select>
    <span class="err" id="countryErr"></span>

    <div class="buttons">
      <button type="submit" id="submitBtn">Submit</button>
      <button type="button" id="resetBtn" class="secondary">Reset</button>
    </div>
  </form>

  <script src="script.js"></script>
</body>
</html>
